name: Build Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder desktop-file-utils libglib2.0-bin

      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          echo "APPIMAGETOOL=/tmp/appimagetool" >> "$GITHUB_ENV"

      - name: Verify Release Governance Baseline
        run: |
          python3 scripts/verify_release_governance.py

      - name: Set Release Runtime Metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          APP_VERSION="$(
            python3 - <<'PY'
            from pathlib import Path
            import re
            text = Path("docker/api/app/main.py").read_text(encoding="utf-8")
            matched = re.search(r'APP_VERSION\s*=\s*"([^"]+)"', text)
            print(matched.group(1) if matched else "")
            PY
          )"
          if [[ -z "$APP_VERSION" ]]; then
            echo "Unable to detect APP_VERSION from docker/api/app/main.py"
            exit 1
          fi
          if [[ "v${APP_VERSION}" != "$TAG" ]]; then
            echo "Tag/API version mismatch: tag=$TAG app=v${APP_VERSION}"
            exit 1
          fi
          echo "SIXPX_IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "SIXPX_EXPECTED_IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "SIXPX_RELEASE_CHANNEL=ga" >> "$GITHUB_ENV"
          echo "SIXPX_EXPECTED_RELEASE_CHANNEL=ga" >> "$GITHUB_ENV"
          echo "SIXPX_BUILD_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SIXPX_EXPECTED_BUILD_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SIXPX_EXPECTED_API_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "SIXPX_ENFORCE_TAG_API_MATCH=true" >> "$GITHUB_ENV"

      - name: Build Linux Packages
        run: |
          chmod +x scripts/build_*.sh
          REQUIRE_ALL_PACKAGES=1 ./scripts/build_packages.sh

      - name: Verify Tagged Artifact Version Policy
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 scripts/verify_release_governance.py --expect-tag "${GITHUB_REF_NAME}" --dist-dir "dist"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.flatpak
            dist/SHA256SUMS.txt

      - name: Generate Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.flatpak
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.flatpak
            dist/SHA256SUMS.txt
