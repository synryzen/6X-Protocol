name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python Sources
        run: |
          python -m compileall src main.py

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify Runtime Governance Baseline
        run: |
          python3 scripts/verify_runtime_governance.py

      - name: Verify Release Governance Baseline
        run: |
          python3 scripts/verify_release_governance.py

      - name: Ensure Bytecode Files Are Not Tracked
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' | grep -Ev '^\.venv/'; then
            echo "Tracked bytecode/cache files found. Remove them from git index."
            exit 1
          fi

  docker_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Smoke Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Run Docker Web Smoke Test
        run: |
          ./scripts/test_docker_web.sh
